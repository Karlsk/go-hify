# nginx 入口网关配置（打进前端镜像 /etc/nginx/conf.d/default.conf）
# 对应 CLAUDE.md《部署架构》与《SSE 链路》：TLS 终结 / 静态长缓存 / /api 反代 / SSE 透传

server {
    listen 80;
    server_name _;

    # 健康探测：nginx 自身应答（80 端口即可探，不依赖 TLS 与后端）
    location = /healthz {
        return 200 'ok';
    }

    # 其余 80 流量跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书由 compose 挂载 deploy/certs/（正式证书 / make certs 自签）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 请求体大小限制（CLAUDE.md nginx 职责⑤）
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 必须 no-cache（带 hash 引用 assets），其余 SPA 路由回退到 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源长缓存（hash 文件名 → immutable）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 反代 + SSE 透传（错任何一条流式就废）：
    #   proxy_buffering off + X-Accel-Buffering: no + proxy_read_timeout 300s + http 1.1；SSE 路由绝不开 gzip
    location /api/ {
        proxy_pass http://hify:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
